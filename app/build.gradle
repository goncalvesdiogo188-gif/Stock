plugins {
    id 'com.android.application'
}

android {
    namespace 'pt.snackbar.stock'
    compileSdk 35

    defaultConfig {
        applicationId 'pt.snackbar.stock'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    // Assinatura: usa keystore/stock.jks se existir (não incluída no git).
    def ks = rootProject.file('keystore/stock.jks')
    signingConfigs {
        release {
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('STOCK_KS_PASS') ?: 'snackbar'
                keyAlias 'stock'
                keyPassword System.getenv('STOCK_KS_PASS') ?: 'snackbar'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
